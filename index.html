<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A random quote generator built with JavaScript that changes the background color and generates new quotes on each button click.">
  <meta name="keywords" content="quote generator, random quotes, javascript, web development, frontend">
  <meta name="author" content="Sarfaraz">

  <title>Random Quote Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Random Quote Generator</h1>
    <div id="quote-box">
      <p id="quote">Press the button to generate a quote!</p>
      <button id="copy-btn">Copy to Clipboard</button>
    </div>
    <button id="generate-btn">Generate Quote</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
